 model:
  name: FakePlant
  args:
  - src/fakemodel.py
  - --yggdrasil
  language: python
  inputs:
  - name: photosynthesis_rate
    datatype:
      type: bytes
    default_file:
      name: ./Input/input.txt
      filetype: table
  outputs:
  - name: growth_rate
    datatype:
      type: array
      items:
        - type: scalar
          subtype: float
          title: growth_rate
          units: cm/s
    default_file:
      name: ./Output/output.txt
      filetype: table
      expected_result: ./Output/expected.txt
  repository_url: https://github.com/cropsinsilico/example-fakemodel
  repository_commit: 16d1d47f4aa6a8a2fdcb219ae5072ca884fc2afb
  description: Example model submission
  validation_command: validate.py
  dependencies:
  - numpy
  additional_dependencies:
    c++: [cmake]
