# About use of m2w64 conda packages:
#   The msmpi recipe currently requires m2w64_fortran explicitly, which
#   has not been rebuilt since 2021, but the updated msys packages (m2-*)
#   require m2-conda-epoch 20230914 making msmpi incompatible. The m2w64
#   versions of git & make are used on windows to prevent conflicts
#   between the m2w64 and other msys2 libraries installed by the
#   non-m2w64 versions of these packages. This conflict can appear as
#   segfaults during compilation if the non-m2w64 msys2 libraries precede
#   the m2w64 on the PATH.
#
#   Once (if) msmpi is updated to use the new msys2 gfortran
#   distribution, then the m2w64- versions should be replaced with m2-
#   versions or the non-prefixed versions if the PATH conflicts are
#   resolved.
general:
  - python-build:
      flags:
        build: True
        build_only: True
      options:
        - name: build
          method: pip
        - name: python-build
          method: conda
  # - binutils:
  #     method: conda_recipe
  #     host: True
  #     flags:
  #       build: True
  #       build_only: True
  - chevron
  - "cross-python_{{ target_platform }}":
      method: conda_recipe
      flags:
        build: True
        build_only: True
        cross_build: True
  - "{{ stdlib('c') }}":
      method: conda_recipe
      # host: True
      # os: unix
      flags:
        build: True
        build_only: True
  - "{{ compiler('c') }}":
      method: conda_recipe
      # host: True
      # os: unix
      flags:
        build: True
        build_only: True
  - "{{ compiler('cxx') }}":
      method: conda_recipe
      # host: True
      # os: unix
      flags:
        build: True
        build_only: True
  # - "{{ compiler('fortran') }}":
  #     method: conda_recipe
  #     # host: True
  #     # os: unix
  #     flags:
  #       build: True
  #       build_only: True
  - cmake>=3.16:
      method: conda_recipe
      flags:
        build: True
        build_only: True
  - deprecation
  - flask
  - git:
      - method: conda
      #   os: unix
      # - name: m2w64-crt-git
      #   method: conda
      #   os: win
  - hatch-fancy-pypi-readme:
      host: True
      host_only: True
      # flags:
      #   build: True
      #   build_only: True
  - matplotlib:
      flags:
        from_env: MATPLOTLIB
      options:
      - name: matplotlib-base
        method: conda
      - name: matplotlib
        method: pip
  - ninja:
      method: conda_recipe
      host: True
      flags:
        build: True
        build_only: True
  - numpy>=1.13.0:
      host: true
      flags:
        from_env: NUMPY
        method_in_setup: conda
        build: True
  - pandas
  - pip:
      method: conda_recipe
      host: True
      host_only: True
  # - pkgconfig:
  #     method: conda_recipe
  #     host: True
  #     flags:
  #       build: True
  #       build_only: True
  - psutil
  - pyperf
  - python:
      method: conda_recipe
      host: True
      flags:
        build: True
        cross_build: True
  - pyyaml
  - pyzmq
  - requests
  - scikit-build-core<0.11.2:  # Pin until scripts fixed https://github.com/scikit-build/scikit-build-core/pull/1047
      host: True
      host_only: True
      # flags:
      #   build: True
      #   build_only: True
  - scipy:
      flags:
        method_in_setup: conda
  - setuptools_scm:
      host: True
      host_only: True
      # flags:
      #   build: True
      #   build_only: True
  - six
  - toml
  - unyt
  - GitPython
  - sysv_ipc:
      os: unix
      host: True
  - yggdrasil-rapidjson:
      method: conda
      flags:
        build: True
  - yggdrasil-python-rapidjson:
      method: pip
extras:
  c:
    description: Dependencies required to compile and run models written in C/C++ as part of yggdrasil integrations
    requires_extras:
    - name: zmq
      os: win
    requirements:
    - cmake>=3.16:
        method: conda
        # os: unix
    # - make:
    #     - method: conda
    #       os: unix
    #     - name: m2w64-make
    #       method: conda
    #       os: win
    - binutils:
        method: conda
    - make:
        method: conda
    - ninja:
        method: conda
    - pkgconfig:
        method: conda
    - c-stdlib:
      - name: "{{ stdlib('c') }}"
        method: conda_recipe
      - method: conda_skip
    - c-compiler:
      - name: "{{ compiler('c') }}"
        method: conda_recipe
      - method: conda
    - cxx-compiler:
      - name: "{{ compiler('cxx') }}"
        method: conda_recipe
      - method: conda
    # - "{{ stdlib('m2w64_c') }}":
    #     method: conda_recipe
    #     os: win
    # - "{{ compiler('m2w64_c') }}":
    #     method: conda_recipe
    #     os: win
    # - "{{ compiler('m2w64_cxx') }}":
    #     method: conda_recipe
    #     os: win
    # - compiler-rt:
    #     method: conda
    #     os: osx
  fortran:
    description: Dependencies required to compile and run models written in Fortran as part of yggdrasil integrations
    requires_extras: [c]
    requirements:
    - fortran-compiler:
        - name: "{{ compiler('fortran') }}"
          method: conda_recipe
          # os: unix
        - method: conda
          # os: unix
        # - name: gfortran
        # - name: "{{ compiler('m2w64_fortran') }}"
        # - name: m2w64-gcc-fortran
        #   os: win
        #   method: conda
        #   add: [m2w64-toolchain_win-64]
        - name: gfortran
          method: apt
        - name: gfortran
          method: brew
          add:
            - name: gcc
              flags:
                reinstall: true
        - name: mingw
          method: choco
        # Alternate source for windows
        # - name: vcpkg-gfortran
        #   method: vcpkg
    # - "{{ compiler('m2w64_fortran') }}":
    #     method: conda_recipe
    #     os: win
  r:
    description: Dependencies required to run models written in R as part of yggdrasil integrations
    requirements:
    - r-base:
        executable: R
        options:
        - name: r-base>3.5
          method: conda
          host: True
          add:
            - name: r-devtools
              method: conda
              os: unix
              host: True
        - method: apt
          add:
            - r-base-dev
            - libtirpc-dev
            - r-cran-devtools
        - name: r
          method: brew
    # - r-devtools:
    #     options:
    #     - method: conda
    #       host: True
    #       os: unix
    #     - method: cran
    #     - method: skip
    #       os: win
    - harfbuzz:
        options:
        - name: libharfbuzz-dev
          method: apt
          add: libfribidi-dev
        - name: harfbuzz
          add: [fribidi, libgit2]
          method: brew
        - method: skip
          os: win
        - method: conda_skip
    - r-bit64:
        - method: conda
          host: True
        - method: cran
          name: bit64
    - r-r6:
        - method: conda
          host: True
        - method: cran
          name: R6
    - r-reticulate:
        - method: conda
          host: True
        - method: cran
          name: reticulate
    - r-zeallot:
        - method: conda
          host: True
        - method: cran
          name: zeallot
    - r-units:
        - method: conda
          host: True
        - method: cran
          name: units
    - udunits:
        - name: libudunits2-dev
          method: apt
        - name: udunits
          method: brew
        - method: skip
          os: win
        - method: conda_skip
    - rpy2

  zmq:
    description: Dependencies required to run models using ZeroMQ sockets for communication in C/C++/Fortran
    requirements:
    - czmq:
        - method: conda
          host: True
        - name: libczmq-dev
          method: apt
        - method: brew
          flags:
            from_src_on_travis: true
        - method: vcpkg
    - lz4:
        - name: lz4
          method: conda
          host: True
        - name: lz4
          method: pip_skip
    - zeromq:
        - method: conda
          host: True
        - name: libzmq3-dev
          method: apt
        - name: zmq
          method: brew
        - method: vcpkg
  julia:
    description: Dependencies required to run models written in R as part of yggdrasil integrations
    requirements:
    - julia:
        executable: julia
        options:
        - method: brew
        - method: choco
        # fails currently on Mac M1, but PR in progress to fix it
        # fails on windows, unclear if it will be added
        # - name: julia>=1.1.1
        #   method: conda
        #   host: True
        #   os: unix
        - name: juliaup
          method: conda
          host: true
  mpi:
    description: Dependencies required to run integrations as MPI parallel jobs
    requirements:
    - mpi4py
    - mpi:
        - name: mpich
          os: linux
          method: conda
        - name: openmpi
          os: osx
          method: conda
        - name: msmpi
          os: win
          method: conda
        - name: msmpi
          os: win
          method: vcpkg
        - name: openmpi-bin  # mpich
          method: apt
          add: [libopenmpi-dev]
        - name: openmpi  # open-mpi
          method: brew
          flags:
            method_validate: conda_supp
          os: osx
  omp:
    description: Dependencies required to run integrations that use OpenMP
    requirements:
    - libomp:
        - name: libomp-dev
          method: apt
        - method: brew
          add: [llvm]  # LLVM clang required to work with omp
        - method: skip
          os: win
        - method: conda_skip
  rmq:
    description: Dependencies required to run integrations with RabbitMQ communication
    requirements:
    - pika>=1.0.0
    # - name: rabbitmq-c
    #   method: brew
    #   os: osx
    # - name: librabbitmq-dev
    #   method: apt
    #   os: linux
  sbml:
    description: Dependencies required to run SBML models as part of yggdrasil integrations
    requirements:
    - name: libroadrunner
      method: pip
    # - ncurses:
    #     - name: ncurses==5.9
    #       method: conda
    #       os: linux
    #     - name: libncurses5
    #       method: apt
    #       os: linux
    #       add: [libncurses5-dev, libncursesw5-dev]
    #     - method: skip
    #       os: osx
    #     - method: skip
    #       os: win
  lpy:
    description: Dependencies required to run LPy models as part of yggdrasil integrations
    requirements:
    - name: lpy
      method: conda
      add:
        - boost==1.66.0
      flags:
        install_flags: [-c, openalea3]
        not_in_recipe: true
        not_in_txt: true
  images:
    description: Dependencies required to perform I/O on common image files.
    requirements:
    - pillow
    - name: ghostscript
      method: conda
  seq:
    description: Dependencies required to handle sequence (nucleotide/protein) I/O
    requirements:
    - biopython
    # pysam only currently available on bioconda and not for osx arm64
    - name: pysam
      method: pip
      os: unix
  pytorch:
    description: Dependencies required to run PyTorch models as part of yggdrasil integrations
    requirements:
    - name: torchvision
      options:
      - name: torchvision
        method: pip
      - name: torchvision
        method: conda
        os: unix
      - method: conda_skip
        os: win
      # - name: torchvision
      #   method: conda
      #   os: win
      #   flags:
      #     install_flags: [-c, pytorch]
      #     not_in_recipe: true
      #     not_in_txt: true
      #     method_validate: conda_supp
    - name: pytorch
      options:
      - name: torch
        method: pip
      - name: pytorch
        method: conda
        os: unix
      - method: conda_skip
        os: win
      # - name: pytorch
      #   method: conda
      #   os: win
      #   flags:
      #     install_flags: [-c, pytorch]
      #     not_in_recipe: true
      #     not_in_txt: true
      #     method_validate: conda_supp
  excel:
    description: Dependencies required to read/write excel files
    requirements:
    - pandas
    - openpyxl
  testing:
    description: Dependencies required to run yggdrasil tests
    requirements:
    - conda-tree:
        method: conda
    - coverage
    - coverage[toml]:
        method: pip
    - flake8
    - flaky
    - pytest
    - pytest-cov
    - pytest-mpi
    - pytest-drop-dup-tests:
        method: pip
    - pytest-rerunfailures
    - pytest-repeat
    - pytest-timeout
    - pytest-xdist
    # Split these into another section?
    - ccache:
        method: conda
        os: unix
        flags:
          method_validate: conda_supp
          not_in_recipe: true
    - strace:
        method: apt
        os: linux
        flags:
          method_validate: conda_supp
    - valgrind:
        method: apt
        os: linux
        flags:
          method_validate: conda_supp
  docs:
    description: Dependencies required to build yggdrasil docs
    requirements:
    - breathe
    - doxygen:
        - method: conda
          add: [graphviz]
        - method: apt
        - method: brew
        - method: vcpkg
        - method: choco
    - pandoc:
        - method: apt
        - name: pandoc-citeproc
          method: brew
          add: [Caskroom/cask/mactex]
        - method: skip
          os: win
        - method: conda_skip
    - pypandoc
    # - r-rd2md:
    #     method: conda
    - r-roxygen2:
        method: conda
    - sphinx
    - sphinx_rtd_theme
    - sphinx-argparse
  dev:
    description: Dependencies recommended for yggdrasil development
    requirements:
    - black
    - ipython
    - PyGithub
    - pre-commit
    - emacs:
        method: conda
        os: unix
bespoke_extras:
- astropy
- pygments
- trimesh
