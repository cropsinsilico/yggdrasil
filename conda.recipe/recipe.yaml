context:
  name: "yggdrasil"
  python_name: "yggdrasil"
  version: "1.10.2"
  version_major: "1"
  build_number: 0
package:
  name: ${{ name|lower }}
  version: ${{ version }}
source:
  path: ../
build:
  number: ${{ build_number }}
  string: py${{ python | version_to_buildstring }}h${{ hash }}_${{ build_number }}
  run_exports:
    - ${{ pin_subpackage('yggdrasil', max_pin='x.x.x') }}
  script: '{{ PYTHON }} -m pip install . --no-deps --ignore-installed -vvv --no-build-isolation'
  entry_points:
    - yggdrasil = yggdrasil.command_line:main
    - ygginfo = yggdrasil.command_line:ygginfo
    - yggrun = yggdrasil.command_line:yggrun
    - yggexample = yggdrasil.command_line:yggexample
    - cisrun = yggdrasil.command_line:yggrun
    - yggcompile = yggdrasil.command_line:yggcompile
    - yggcc = yggdrasil.command_line:yggcc
    - yggcctool = yggdrasil.command_line:cc_toolname
    - yggldtool = yggdrasil.command_line:ld_toolname
    - yggccflags = yggdrasil.command_line:cc_flags
    - yggldflags = yggdrasil.command_line:ld_flags
    - yggschema = yggdrasil.command_line:regen_schema
    - yggbuildapi_c = yggdrasil.command_line:rebuild_c_api
    - yggconfig = yggdrasil.command_line:update_config
    - yggtime_comm = yggdrasil.command_line:yggtime_comm
    - yggtime_lang = yggdrasil.command_line:yggtime_lang
    - yggtime_os = yggdrasil.command_line:yggtime_os
    - yggtime_py = yggdrasil.command_line:yggtime_py
    - yggtime_paper = yggdrasil.command_line:yggtime_paper
    - yggvalidate = yggdrasil.command_line:validate_yaml
    - ygginstall = yggdrasil.command_line:ygginstall
    - yggclean = yggdrasil.command_line:yggclean
    - yggmodelform = yggdrasil.command_line:yggmodelform
    - yggdevup = yggdrasil.command_line:yggdevup
    - ygggha = yggdrasil.command_line:generate_gha_workflow
requirements:
  build:
    - cmake >=3.16
    - ninja
    - numpy >=1.13.0
    - python-build
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
    - if: build_platform != target_platform
      then:
        - cross-python_${{ target_platform }}
        - python
  host:
    - hatch-fancy-pypi-readme
    - ninja
    - numpy >=1.13.0
    - pip
    - python
    - scikit-build-core <0.11.2
    - setuptools_scm
    - if: unix
      then:
        - sysv_ipc
  run:
    - GitPython
    - chevron
    - deprecation
    - flask
    - matplotlib-base
    - numpy >=1.13.0
    - pandas
    - psutil
    - pyperf
    - python
    - pyyaml
    - pyzmq
    - requests
    - scipy
    - six
    - toml
    - unyt
    - if: unix
      then:
        - git
        - sysv_ipc
    - if: win
      then:
        - m2w64-crt-git
outputs:
  - name: yggdrasil
  - name: yggdrasil.c
    build:
      string: py${{ python | version_to_buildstring }}h${{ hash }}_${{ build_number }}
      run_exports:
        - ${{ pin_subpackage('yggdrasil.c') }}
    requirements:
      host:
        - python
      run:
        - binutils
        - cmake >=3.16
        - make
        - ninja
        - pkgconfig
        - ${{ compiler('c') }}
        - ${{ compiler('cxx') }}
        - ${{ stdlib('c') }}
        - if: win
          then:
            - ${{ pin_subpackage('yggdrasil.zmq', exact=True) }}
  - name: yggdrasil.fortran
    build:
      string: py${{ python | version_to_buildstring }}h${{ hash }}_${{ build_number }}
      run_exports:
        - ${{ pin_subpackage('yggdrasil.fortran') }}
    requirements:
      host:
        - python
      run:
        - ${{ pin_subpackage('yggdrasil.c', exact=True) }}
        - ${{ compiler('fortran') }}
  - name: yggdrasil.r
    build:
      string: py${{ python | version_to_buildstring }}h${{ hash }}_${{ build_number }}
      run_exports:
        - ${{ pin_subpackage('yggdrasil.r') }}
    requirements:
      host:
        - python
        - r-base >3.5
        - r-bit64
        - r-r6
        - r-reticulate
        - r-units
        - r-zeallot
        - if: unix
          then:
            - r-devtools
      run:
        - ${{ pin_subpackage('yggdrasil', exact=True) }}
        - r-base >3.5
        - r-bit64
        - r-r6
        - r-reticulate
        - r-units
        - r-zeallot
        - rpy2
        - if: unix
          then:
            - r-devtools
  - name: yggdrasil.zmq
    build:
      string: py${{ python | version_to_buildstring }}h${{ hash }}_${{ build_number }}
      run_exports:
        - ${{ pin_subpackage('yggdrasil.zmq') }}
    requirements:
      host:
        - czmq
        - lz4
        - python
        - zeromq
      run:
        - ${{ pin_subpackage('yggdrasil', exact=True) }}
        - czmq
        - lz4
        - zeromq
  - name: yggdrasil.julia
    build:
      string: py${{ python | version_to_buildstring }}h${{ hash }}_${{ build_number }}
      run_exports:
        - ${{ pin_subpackage('yggdrasil.julia') }}
    requirements:
      host:
        - juliaup
        - python
      run:
        - ${{ pin_subpackage('yggdrasil', exact=True) }}
        - juliaup
  - name: yggdrasil.mpi
    build:
      string: py${{ python | version_to_buildstring }}h${{ hash }}_${{ build_number }}
      run_exports:
        - ${{ pin_subpackage('yggdrasil.mpi') }}
    requirements:
      host:
        - python
      run:
        - ${{ pin_subpackage('yggdrasil', exact=True) }}
        - mpi4py
        - if: linux
          then:
            - mpich
        - if: win
          then:
            - msmpi
        - if: osx
          then:
            - openmpi
  - name: yggdrasil.rmq
    build:
      string: py${{ python | version_to_buildstring }}h${{ hash }}_${{ build_number }}
      run_exports:
        - ${{ pin_subpackage('yggdrasil.rmq') }}
    requirements:
      host:
        - python
      run:
        - ${{ pin_subpackage('yggdrasil', exact=True) }}
        - pika >=1.0.0
  - name: yggdrasil.images
    build:
      string: py${{ python | version_to_buildstring }}h${{ hash }}_${{ build_number }}
      run_exports:
        - ${{ pin_subpackage('yggdrasil.images') }}
    requirements:
      host:
        - python
      run:
        - ${{ pin_subpackage('yggdrasil', exact=True) }}
        - ghostscript
        - pillow
  - name: yggdrasil.seq
    build:
      string: py${{ python | version_to_buildstring }}h${{ hash }}_${{ build_number }}
      run_exports:
        - ${{ pin_subpackage('yggdrasil.seq') }}
    requirements:
      host:
        - python
      run:
        - ${{ pin_subpackage('yggdrasil', exact=True) }}
        - biopython
  - name: yggdrasil.pytorch
    build:
      string: py${{ python | version_to_buildstring }}h${{ hash }}_${{ build_number }}
      run_exports:
        - ${{ pin_subpackage('yggdrasil.pytorch') }}
    requirements:
      host:
        - python
      run:
        - ${{ pin_subpackage('yggdrasil', exact=True) }}
        - if: unix
          then:
            - pytorch
            - torchvision
  - name: yggdrasil.excel
    build:
      string: py${{ python | version_to_buildstring }}h${{ hash }}_${{ build_number }}
      run_exports:
        - ${{ pin_subpackage('yggdrasil.excel') }}
    requirements:
      host:
        - python
      run:
        - ${{ pin_subpackage('yggdrasil', exact=True) }}
        - openpyxl
        - pandas
  - name: yggdrasil.testing
    build:
      string: py${{ python | version_to_buildstring }}h${{ hash }}_${{ build_number }}
      run_exports:
        - ${{ pin_subpackage('yggdrasil.testing') }}
    requirements:
      host:
        - python
      run:
        - ${{ pin_subpackage('yggdrasil', exact=True) }}
        - conda-tree
        - coverage[toml]
        - flake8
        - flaky
        - pytest
        - pytest-cov
        - pytest-mpi
        - pytest-repeat
        - pytest-rerunfailures
        - pytest-timeout
        - pytest-xdist
  - name: yggdrasil.docs
    build:
      string: py${{ python | version_to_buildstring }}h${{ hash }}_${{ build_number }}
      run_exports:
        - ${{ pin_subpackage('yggdrasil.docs') }}
    requirements:
      host:
        - python
      run:
        - ${{ pin_subpackage('yggdrasil', exact=True) }}
        - breathe
        - doxygen
        - graphviz
        - pypandoc
        - r-roxygen2
        - sphinx
        - sphinx-argparse
        - sphinx_rtd_theme
  - name: yggdrasil.dev
    build:
      string: py${{ python | version_to_buildstring }}h${{ hash }}_${{ build_number }}
      run_exports:
        - ${{ pin_subpackage('yggdrasil.dev') }}
    requirements:
      host:
        - python
      run:
        - ${{ pin_subpackage('yggdrasil', exact=True) }}
        - PyGithub
        - black
        - emacs
        - ipython
        - pre-commit
  - name: yggdrasil.astropy
    build:
      string: py${{ python | version_to_buildstring }}h${{ hash }}_${{ build_number }}
      run_exports:
        - ${{ pin_subpackage('yggdrasil.astropy') }}
    requirements:
      host:
        - python
      run:
        - ${{ pin_subpackage('yggdrasil', exact=True) }}
        - astropy
  - name: yggdrasil.pygments
    build:
      string: py${{ python | version_to_buildstring }}h${{ hash }}_${{ build_number }}
      run_exports:
        - ${{ pin_subpackage('yggdrasil.pygments') }}
    requirements:
      host:
        - python
      run:
        - ${{ pin_subpackage('yggdrasil', exact=True) }}
        - pygments
  - name: yggdrasil.trimesh
    build:
      string: py${{ python | version_to_buildstring }}h${{ hash }}_${{ build_number }}
      run_exports:
        - ${{ pin_subpackage('yggdrasil.trimesh') }}
    requirements:
      host:
        - python
      run:
        - ${{ pin_subpackage('yggdrasil', exact=True) }}
        - trimesh
tests:
  - python:
      imports:
        - yggdrasil
  - script:
      - yggrun -h
    requirements:
      run:
        - pytest
        - flask
        - ninja
        - cmake
        - ${{ stdlib('c') }}
        - ${{ compiler('c') }}
        - ${{ compiler('cxx') }}
        - ${{ compiler('fortran') }}
    files:
      source:
        - tests/
about:
  homepage: https://github.com/cropsinsilico/yggdrasil
  repository: https://github.com/cropsinsilico/yggdrasil
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE.txt
  summary: A framework for connecting computational models from multiple languages.
  description: |
    The Crops in Silico (CiS) framework, yggdrasil, provides support for
    connecting scientific models written in different programming languages.
    To connect two models, modelers add communications interfaces to the model code
    and provide declarative specification files that identfy the
    models that should be run and the inputs and outputs those models
    expect. yggdrasil uses this information to launch the models
    on parallel processes and orchestrate asynchronous communication between them.
    Although designed for connecting crop models, yggdrasil can be used to
    connect scientific models from any domain.
  documentation: https://cropsinsilico.github.io/yggdrasil
extra:
  recipe-maintainers:
    - langmm
